# Volledige productieomgeving op één VPS: database, applicatie, HTTPS-proxy en dagelijkse back-ups.
# Starten:  docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: innvenlo
      POSTGRES_USER: innvenlo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Stel POSTGRES_PASSWORD in .env in}
      TZ: Europe/Amsterdam
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innvenlo -d innvenlo"]
      interval: 10s
      retries: 5
    # Database is NIET bereikbaar van buitenaf (geen 'ports')

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://innvenlo:${POSTGRES_PASSWORD}@db:5432/innvenlo
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:-boeken.innvenlo.nl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Amsterdam
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  caddydata:
